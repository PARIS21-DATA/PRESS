[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "press"  # Replace with your package name
version = "0.1.0"        # Replace with your version
description = "A package for analyzing CRS data"  # Optional
authors = [
    { name = "Your Name", email = "your.email@example.com" }  # Optional
]
license = { text = "MIT" }  # Optional
dependencies = [
    "pandas==2.2.3",
    "numpy==2.0.2",
    "mkdocs==1.6.1",
    "mkdocs-material==9.6.11",
    "mkdocstrings==0.29.1",
    "mkdocstrings-python==1.16.8",
    "requests==2.32.3",
    "pyarrow==19.0.1"
]
readme = "README.md"  # Optional, path to your README file
requires-python = ">=3.7"  # Specify the minimum Python version

