site_name: Press technical methodology documentation
site_url: http://localhost:8000
docs_dir: docs
theme:
  name: material
  font:
    text: Merriweather Sans
    code: Red Hat Mono
  features:
    - navigation.footer
  palette:
    # Dark Mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Dark mode
      primary: green
      accent: deep purple

    # Light Mode
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Light mode
      primary: black
      accent: deep orange

# Optional: Plugins to enhance functionality
plugins:
  - search
  - mkdocstrings
  - autorefs:
      link_titles: false

# Navigation (sidebar) structure
nav:
  - Home: index.md
  - src:
      - download crs: src/download_crs.md
      - text processing: src/text_processing.md
  - notebooks:
      - all steps: notebooks/collect_all_steps.md
  - About: about.md

# Markdown Extensions for better formatting
markdown_extensions:
  - admonition
  - footnotes
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - codehilite:
      guess_lang: false
  - toc:
      permalink: "#"
